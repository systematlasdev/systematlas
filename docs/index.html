            "symbol": "buildPage",
            "line": 33

        {
          "id": "read",

              "name": "raw",
              "type": "string"

        },
        {
          "id": "frontmatter",
          "type": "step",
          "label": "Parse frontmatter",
          "description": [

          "outputs": [
            {
              "name": "data"

            {
              "name": "body",
              "type": "string"

            "line": 9

        {
          "id": "render",
          "type": "step",

          "sequence": "render-markdown",

            "line": 6

          "id": "is_md",

          "label": "Markdown file?",

          "owner": "assets"

          "id": "skip",
          "type": "step",
          "label": "Skip (.md)",

          "id": "copy",
          "type": "io",
          "label": "Copy file → output",

          "type": "flow",
          "label": "each entry"

          "to": "skip",
          "type": "branch",

          "to": "copy",
          "type": "branch",
          "label": "no"

        {

          "to": "walk",
          "type": "return",
          "label": "next entry"
        },
        {
          "from": "skip",
          "to": "walk",
          "type": "return",

        },

          "from": "walk",
