  <script>window.__SYSTEMATLAS__={
  "flows": {
    "build-page": {
      "version": "1",
      "id": "build-page",
      "title": "Build one page",
      "layout": "TB",
      "overview": [
        "The per-page pipeline run once for every Markdown file. 'Render Markdown' drills down further into the exact call trace (a Sequence)."
      ],
      "actors": [
        {
          "id": "pages",
          "label": "Page pipeline",
          "kind": "service"
        },
        {
          "id": "markdown",
          "label": "Markdown renderer",
          "kind": "service"
        },
        {
          "id": "fs",
          "label": "Filesystem",
          "kind": "infra"
        }
      ],
      "nodes": [
        {
          "id": "start",
          "type": "terminal",
          "label": "Build one page",
          "description": [
            "Called once per discovered .md file with the resolved config."
          ],
          "source": {
            "file": "src/page.js",
            "symbol": "buildPage",
            "line": 33
          }
        },
        {
          "id": "read",
          "type": "io",
          "label": "Read .md file",
          "description": [
            "Read the raw Markdown source from disk."
          ],
          "owner": "fs",
          "outputs": [
            {
              "name": "raw",
              "type": "string"
            }
          ]
        },
        {
          "id": "frontmatter",
          "type": "step",
          "label": "Parse frontmatter",
          "description": [
            "Pull the leading `--- key: value ---` block; the rest is the body."
          ],
          "owner": "pages",
          "outputs": [
            {
              "name": "data"
            },
            {
              "name": "body",
              "type": "string"
            }
          ],
          "source": {
            "file": "src/page.js",
            "symbol": "parseFrontmatter",
            "line": 9
          }
        },
        {
          "id": "render",
          "type": "step",
          "label": "Render Markdown",
          "description": [
            "Convert the body to HTML via the hand-written renderer.",
            "Open to see the exact call trace (tokenize → render tokens → escape/resolve)."
          ],
          "owner": "markdown",
          "sequence": "render-markdown",
          "inputs": [
            {
              "name": "body",
              "type": "string"
            }
          ],
          "outputs": [
            {
              "name": "bodyHtml",
              "type": "string"
            }
          ],
          "source": {
            "file": "src/markdown.js",
            "symbol": "renderMarkdown",
            "line": 81
          }
        },
        {
          "id": "layout",
          "type": "step",
          "label": "Apply layout",
          "description": [
            "Wrap the body HTML in the page shell; escape the page + site titles."
          ],
          "owner": "pages",
          "source": {
            "file": "src/page.js",
            "symbol": "applyLayout",
            "line": 22
          }
        },
        {
          "id": "write",
          "type": "io",
          "label": "Write .html file",
          "description": [
            "Write the final HTML to the output path (mirrors the source path, .md → .html)."
          ],
          "owner": "fs"
        },
        {
          "id": "done",
          "type": "terminal",
          "label": "Page written",
          "description": [
            "Return the page metadata (used later by the sitemap)."
          ]
        }
      ],
      "edges": [
        {
          "from": "start",
          "to": "read",
          "type": "flow"
        },
        {
          "from": "read",
          "to": "frontmatter",
          "type": "flow"
        },
        {
          "from": "frontmatter",
          "to": "render",
          "type": "flow",
          "label": "body"
        },
        {
          "from": "render",
          "to": "layout",
          "type": "flow",
          "label": "bodyHtml"
        },
        {
          "from": "layout",
          "to": "write",
          "type": "flow"
        },
        {
          "from": "write",
          "to": "done",
          "type": "flow"
        }
      ]
    },
    "copy-assets": {
      "version": "1",
      "id": "copy-assets",
      "title": "Copy assets",
      "layout": "TB",
      "overview": [
        "Walk the source tree and copy every non-Markdown file into the output, preserving relative paths. Markdown is skipped here (the page pipeline handles it)."
      ],
      "actors": [
        {
          "id": "assets",
          "label": "Assets",
          "kind": "service"
        },
        {
          "id": "fs",
          "label": "Filesystem",
          "kind": "infra"
        }
      ],
      "nodes": [
        {
          "id": "start",
          "type": "terminal",
          "label": "Copy assets",
          "description": [
            "Recursively walk the source directory."
          ],
          "source": {
            "file": "src/assets.js",
            "symbol": "copyAssets",
            "line": 6
          }
        },
        {
          "id": "walk",
          "type": "step",
          "label": "Walk source tree",
          "description": [
            "Reads the source folder entries with readdir({ withFileTypes: true }).",
            "Recurses into every sub-directory, so nested assets are found at any depth.",
            "Hands each file to the next step (the \"Markdown?\" decision); directories never reach it."
          ],
          "owner": "assets",
          "source": {
            "file": "src/assets.js",
            "symbol": "copyAssets",
            "line": 6
          },
          "refs": [
            {
              "label": "assets.js — source on GitHub",
              "url": "https://github.com/systematlasdev/systematlas/blob/main/demo/mdsite/src/assets.js"
            }
          ]
        },
        {
          "id": "is_md",
          "type": "decision",
          "label": "Markdown file?",
          "description": [
            "Decide per entry whether it is a .md file."
          ],
          "owner": "assets"
        },
        {
          "id": "skip",
          "type": "step",
          "label": "Skip (.md)",
          "description": [
            "Markdown is rendered by the page pipeline, not copied."
          ],
          "owner": "assets"
        },
        {
          "id": "copy",
          "type": "io",
          "label": "Copy file → output",
          "description": [
            "Create the output sub-directory and copy the file verbatim."
          ],
          "owner": "fs"
        },
        {
          "id": "done",
          "type": "terminal",
          "label": "Assets copied",
          "description": [
            "Return the list of copied relative paths."
          ]
        }
      ],
      "edges": [
        {
          "from": "start",
          "to": "walk",
          "type": "flow"
        },
        {
          "from": "walk",
          "to": "is_md",
          "type": "flow",
          "label": "each entry"
        },
        {
          "from": "is_md",
          "to": "skip",
          "type": "branch",
          "label": "yes (.md)"
        },
        {
          "from": "is_md",
          "to": "copy",
          "type": "branch",
          "label": "no"
        },
        {
          "from": "copy",
          "to": "walk",
          "type": "return",
          "label": "next entry"
        },
        {
          "from": "skip",
          "to": "walk",
          "type": "return",
          "label": "next entry"
        },
        {
          "from": "walk",
          "to": "done",
          "type": "flow",
          "label": "tree exhausted"
        }
      ],
      "twin": "copy-assets-seq"
    },
    "load-config": {
      "version": "1",
      "id": "load-config",
      "title": "Load config",
      "layout": "TB",
      "overview": [
        "Resolve the effective configuration by layering sources and validating the result before the build proceeds."
      ],
      "actors": [
        {
          "id": "config",
          "label": "Config",
          "kind": "service"
        },
        {
          "id": "fs",
          "label": "Filesystem",
          "kind": "infra"
        }
      ],
      "nodes": [
        {
          "id": "start",
          "type": "terminal",
          "label": "Load config",
          "description": [
            "Begin resolving config for this build."
          ],
          "source": {
            "file": "src/config.js",
            "symbol": "loadConfig",
            "line": 14
          }
        },
        {
          "id": "defaults",
          "type": "step",
